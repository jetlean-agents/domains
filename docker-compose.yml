services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://domains:${POSTGRES_PASSWORD}@db:5432/domains
      PORT: "3000"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CACHE_TTL_REGISTERED: ${CACHE_TTL_REGISTERED:-86400}
      CACHE_TTL_AVAILABLE: ${CACHE_TTL_AVAILABLE:-10800}
      CACHE_TTL_UNKNOWN: ${CACHE_TTL_UNKNOWN:-900}
      RDAP_TIMEOUT_MS: ${RDAP_TIMEOUT_MS:-5000}
      WHOIS_TIMEOUT_MS: ${WHOIS_TIMEOUT_MS:-5000}
      PER_HOST_CONCURRENCY: ${PER_HOST_CONCURRENCY:-2}
      PER_HOST_RPS: ${PER_HOST_RPS:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CZDS_USERNAME: ${CZDS_USERNAME:-}
      CZDS_PASSWORD: ${CZDS_PASSWORD:-}
      CZDS_ZONES: ${CZDS_ZONES:-}
      ZONE_FILES_DIR: ${ZONE_FILES_DIR:-}
      ZONE_DATA_DIR: /data/zones
      ZONE_KEEP_SNAPSHOTS: ${ZONE_KEEP_SNAPSHOTS:-2}
      ZONE_DIFF_CRON: ${ZONE_DIFF_CRON:-}
      CSV_IMPORT_URLS: ${CSV_IMPORT_URLS:-}
      CSV_IMPORT_CRON: ${CSV_IMPORT_CRON:-}
      UA_WATCH_CRON: ${UA_WATCH_CRON:-}
    # No host port published: prod is reached only via Tailscale (host networking /
    # a Tailscale-bound proxy), stage via Dokploy/Traefik — both talk to the
    # container on the internal compose network, never 0.0.0.0 on the host.
    expose:
      - "3000"
    volumes:
      - zone-data:/data/zones
    mem_limit: 512m
    cpus: 0.5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: domains
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: domains
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5

volumes:
  db-data:
  zone-data:
